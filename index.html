<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Agent XAUUSD - Guts AI</title>
    <style>
        :root { --bg: #f8f9fa; --card-bg: #ffffff; --text: #333333; --primary: #2563eb; --primary-hover: #1d4ed8; --gold: #d97706; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { font-size: 1.5rem; text-align: center; margin-top: 0; }
        .warning { background-color: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid #f87171; }
        .price-card { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 24px; }
        .price-label { font-size: 0.9rem; color: #92400e; margin-bottom: 8px; }
        .price-value { font-size: 2.5rem; font-weight: 800; color: var(--gold); margin: 0; }
        .price-update { font-size: 0.75rem; color: #b45309; margin-top: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover:not(:disabled) { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .result-box { margin-top: 24px; padding: 16px; background-color: #f3f4f6; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; border-left: 4px solid var(--primary); min-height: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 AI Agent XAUUSD</h1>
        <p style="text-align:center; font-size: 0.9rem; color: #666; margin-top: -10px;">Powered by Guts AI</p>

        <div class="warning">
            <strong>Peringatan Keamanan:</strong> Memasukkan API Key di sini bersifat tidak aman untuk publik. Gunakan hanya untuk demo pribadi.
        </div>

        <div class="price-card">
            <div class="price-label">Harga XAUUSD Saat Ini (Live)</div>
            <h2 class="price-value" id="live-price">Memuat...</h2>
            <div class="price-update" id="last-update">Menghubungkan...</div>
        </div>

        <div class="form-group">
            <label for="api-key">API Key Guts AI</label>
            <input type="password" id="api-key" placeholder="Tempel kunci sk-guts-... di sini" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="ai-model">Pilih Model Guts AI</label>
            <select id="ai-model">
                <!-- Daftar model ini sesuai dengan API Guts AI -->
                <option value="claude-sonnet-5.5">Claude Sonnet 5.5</option>
                <option value="gpt-5.6-terra">GPT-5.6 Terra</option>
                <option value="deepseek-v4-pro">DeepSeek V4 Pro</option>
                <option value="guts-default">Guts Default (Otomatis)</option>
            </select>
        </div>

        <button id="analyze-btn">Analisis dengan Guts AI</button>

        <div class="result-box" id="analysis-result">
            Hasil analisis AI akan muncul di sini.
        </div>
    </div>

    <script>
        const priceEl = document.getElementById('live-price');
        const updateEl = document.getElementById('last-update');
        const btn = document.getElementById('analyze-btn');
        const resultEl = document.getElementById('analysis-result');
        const apiKeyInput = document.getElementById('api-key');
        const modelSelect = document.getElementById('ai-model');

        let currentPrice = 0;

        // ==========================================
        // 1. AMBIL HARGA LIVE XAUUSD
        // ==========================================
        async function fetchLivePrice() {
            try {
                const response = await fetch('https://api.gold-api.com/price/XAU');
                if (!response.ok) throw new Error("Gagal mengambil data");
                const data = await response.json();
                currentPrice = data.price;
                priceEl.textContent = `$${currentPrice.toFixed(2)}`;
                updateEl.textContent = `Diperbarui: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error("Error price:", error);
                priceEl.textContent = "Error";
                updateEl.textContent = "Gagal memuat harga live";
            }
        }
        fetchLivePrice();
        setInterval(fetchLivePrice, 5000);

        // ==========================================
        // 2. ANALISIS AI VIA GUTS AI
        // ==========================================
        btn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const model = modelSelect.value;

            if (!apiKey) {
                alert("Harap masukkan API Key Guts AI (sk-guts-...)!");
                apiKeyInput.focus();
                return;
            }
            if (currentPrice === 0) {
                alert("Harga live belum siap. Tunggu sebentar.");
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Menganalisis...';
            resultEl.textContent = 'Menghubungi Guts AI...';

            try {
                const prompt = `Harga XAUUSD saat ini adalah $${currentPrice.toFixed(2)}. Berikan analisis teknikal singkat dan rekomendasi trading (BUY/SELL/HOLD) beserta level Entry, Take Profit, dan Stop Loss. Jawab dengan bahasa Indonesia yang padat dan profesional.`;

                // Endpoint resmi Guts AI
                const response = await fetch('https://api.gutsai.id/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: 'Anda adalah analis trading emas (XAUUSD) profesional.' },
                            { role: 'user', content: prompt }
                        ],
                        temperature: 0.3,
                        max_tokens: 800
                    })
                });

                // Baca response body
                const data = await response.json();

                // Cek jika ada error dari server Guts AI
                if (!response.ok) {
                    // Tampilkan pesan error yang lebih detail dari Guts AI
                    const errorMessage = data.error?.message || data.message || `Error HTTP: ${response.status}`;
                    throw new Error(errorMessage);
                }

                // Tampilkan hasil
                resultEl.textContent = data.choices[0].message.content;

            } catch (error) {
                console.error("AI Error:", error);
                
                // Tampilan pesan error yang lebih ramah
                let userFriendlyError = `❌ Gagal Menganalisis:\n${error.message}\n\n`;
                if (error.message.includes('Failed to fetch')) {
                    userFriendlyError += "Kemungkinan masalah koneksi internet atau server Guts AI sedang down.";
                } else if (error.message.includes('401')) {
                    userFriendlyError += "API Key salah atau tidak valid. Periksa kembali kunci dari dashboard Guts AI Anda.";
                } else if (error.message.includes('402') || error.message.includes('Quota')) {
                    userFriendlyError += "Saldo atau kuota Guts AI Anda mungkin habis. Silakan top-up.";
                }
                
                resultEl.textContent = userFriendlyError;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analisis dengan Guts AI';
            }
        });
    </script>
</body>
</html>
