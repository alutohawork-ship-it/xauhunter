<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading Agent XAUUSD</title>
    <style>
        :root { --bg: #f8f9fa; --card-bg: #ffffff; --text: #333333; --primary: #2563eb; --gold: #d97706; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; text-align: center; margin-top: 0; }
        .warning { background-color: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid #f87171; }
        .price-card { background: linear-gradient(135deg, #fffbeb, #fef3c7); border: 1px solid #fcd34d; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 24px; }
        .price-value { font-size: 2.5rem; font-weight: 800; color: var(--gold); margin: 0; }
        .price-update { font-size: 0.75rem; color: #b45309; margin-top: 8px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #9ca3af; }
        .result-box { margin-top: 20px; padding: 16px; background-color: #f3f4f6; border-radius: 8px; font-size: 0.95rem; white-space: pre-wrap; line-height: 1.5; border-left: 4px solid var(--primary); min-height: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 AI Agent XAUUSD</h1>
        <div class="warning">
            <strong>Peringatan:</strong> API Key Anda terekspos di browser. Gunakan hanya untuk demo pribadi.
        </div>

        <div class="price-card">
            <div>Harga XAUUSD Saat Ini (Live)</div>
            <h2 class="price-value" id="live-price">Memuat...</h2>
            <div class="price-update" id="last-update">Menghubungkan...</div>
        </div>

        <div class="form-group">
            <label for="api-key">API Key Guts AI</label>
            <input type="password" id="api-key" placeholder="sk-guts-..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="ai-model">Model Guts AI</label>
            <input type="text" id="ai-model" value="guts-default" placeholder="guts-default">
        </div>

        <button id="analyze-btn">Analisis dengan Guts AI</button>
        <div class="result-box" id="analysis-result">Hasil analisis akan muncul di sini.</div>
    </div>

    <script>
        const priceEl = document.getElementById('live-price');
        const updateEl = document.getElementById('last-update');
        const btn = document.getElementById('analyze-btn');
        const resultEl = document.getElementById('analysis-result');
        const apiKeyInput = document.getElementById('api-key');
        const modelInput = document.getElementById('ai-model');

        let currentPrice = 0;

        // 1. Ambil Harga Live
        async function fetchPrice() {
            try {
                const res = await fetch('https://api.gold-api.com/price/XAU');
                const data = await res.json();
                currentPrice = data.price;
                priceEl.textContent = `$${currentPrice.toFixed(2)}`;
                updateEl.textContent = `Diperbarui: ${new Date().toLocaleTimeString()}`;
            } catch (e) {
                priceEl.textContent = "Error";
                updateEl.textContent = "Gagal memuat harga";
            }
        }
        fetchPrice();
        setInterval(fetchPrice, 5000);

        // 2. Analisis AI dengan Proxy CORS
        btn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            const model = modelInput.value.trim() || 'guts-default';

            if (!key) return alert("Masukkan API Key Guts AI!");
            if (currentPrice === 0) return alert("Tunggu harga live dimuat.");

            btn.disabled = true;
            btn.textContent = 'Menganalisis...';
            resultEl.textContent = 'Menghubungi Guts AI melalui proxy...';

            // Endpoint asli Guts AI
            const targetUrl = 'https://api.gutsai.id/v1/chat/completions';
            
            // Bungkus URL target dengan CORS Proxy
            const proxiedUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxiedUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: 'Anda analis trading XAUUSD profesional.' },
                            { role: 'user', content: `Harga XAUUSD: $${currentPrice.toFixed(2)}. Berikan rekomendasi BUY/SELL/HOLD, Entry, TP, dan SL.` }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || `HTTP ${response.status}`);
                }

                resultEl.textContent = data.choices[0].message.content;

            } catch (error) {
                console.error("AI Error:", error);
                resultEl.textContent = `❌ Gagal:\n${error.message}\n\nJika masih gagal, coba gunakan penyedia lain (Groq/OpenAI) atau backend proxy.`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analisis dengan Guts AI';
            }
        });
    </script>
</body>
</html>
