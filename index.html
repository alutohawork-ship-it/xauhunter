<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trading XAUUSD</title>
    <style>
        /* CSS Ringkas */
        body { font-family: sans-serif; background: #f8f9fa; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .price-card { background: #fffbeb; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid #fcd34d; }
        .price-value { font-size: 2.5rem; font-weight: 800; color: #d97706; margin: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #2563eb; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 16px; background: #f3f4f6; border-radius: 8px; white-space: pre-wrap; font-size: 0.95rem; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="text-align:center;">🤖 AI Agent XAUUSD</h1>

        <div class="price-card">
            <div>Harga Live XAUUSD:</div>
            <h2 class="price-value" id="live-price">Memuat...</h2>
            <div style="font-size: 0.8rem; color: #666;" id="last-update"></div>
        </div>

        <!-- INI BAGIAN DROPDOWN YANG HARUSNYA MUNCUL -->
        <div class="form-group">
            <label>Pilih Penyedia AI</label>
            <select id="ai-provider">
                <option value="guts">🟢 Guts AI (Gunakan ini)</option>
                <option value="groq">⚡ Groq (Gratis)</option>
                <option value="openai">OpenAI</option>
                <option value="custom">Custom API</option>
            </select>
        </div>

        <div class="form-group hidden" id="custom-url-group">
            <label>URL API Custom</label>
            <input type="text" id="custom-url" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>API Key</label>
            <input type="password" id="api-key" placeholder="Masukkan API Key">
        </div>

        <div class="form-group">
            <label>Nama Model</label>
            <input type="text" id="ai-model" value="claude-sonnet-5.5">
        </div>

        <button id="analyze-btn">Analisis dengan AI</button>
        <div class="result-box" id="analysis-result">Hasil analisis akan muncul di sini.</div>
    </div>

    <script>
        const priceEl = document.getElementById('live-price');
        const updateEl = document.getElementById('last-update');
        const providerSelect = document.getElementById('ai-provider');
        const modelInput = document.getElementById('ai-model');
        const customUrlGroup = document.getElementById('custom-url-group');
        const btn = document.getElementById('analyze-btn');
        const resultEl = document.getElementById('analysis-result');

        let currentPrice = 0;

        // Harga Live
        async function fetchPrice() {
            try {
                const res = await fetch('https://api.gold-api.com/price/XAU');
                const data = await res.json();
                currentPrice = data.price;
                priceEl.textContent = `$${currentPrice.toFixed(2)}`;
                updateEl.textContent = `Update: ${new Date().toLocaleTimeString()}`;
            } catch (e) { priceEl.textContent = "Error"; }
        }
        fetchPrice();
        setInterval(fetchPrice, 5000);

        // Ganti Form Berdasarkan Provider
        providerSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            customUrlGroup.classList.add('hidden');
            
            if (val === 'guts') modelInput.value = 'claude-sonnet-5.5';
            if (val === 'groq') modelInput.value = 'llama-3.3-70b-versatile';
            if (val === 'openai') modelInput.value = 'gpt-4o-mini';
            if (val === 'custom') {
                customUrlGroup.classList.remove('hidden');
                modelInput.value = '';
            }
        });

        // Analisis AI
        btn.addEventListener('click', async () => {
            const key = document.getElementById('api-key').value.trim();
            const provider = providerSelect.value;
            const model = modelInput.value.trim();
            let url = '';

            if (!key) return alert("API Key wajib diisi!");

            if (provider === 'guts') url = 'https://api.gutsai.id/v1/chat/completions';
            else if (provider === 'groq') url = 'https://api.groq.com/openai/v1/chat/completions';
            else if (provider === 'openai') url = 'https://api.openai.com/v1/chat/completions';
            else url = document.getElementById('custom-url').value.trim();

            btn.disabled = true;
            btn.textContent = 'Menganalisis...';
            resultEl.textContent = 'Menghubungi AI...';

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: 'Anda analis trading XAUUSD profesional.' },
                            { role: 'user', content: `Harga XAUUSD: $${currentPrice.toFixed(2)}. Berikan rekomendasi BUY/SELL/HOLD beserta Entry, TP, dan SL.` }
                        ],
                        temperature: 0.3
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
                
                resultEl.textContent = data.choices[0].message.content;
            } catch (err) {
                resultEl.textContent = `❌ Error: ${err.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analisis dengan AI';
            }
        });
    </script>
</body>
</html>
